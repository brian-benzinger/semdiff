version: 2
updates:
  # Keep GitHub Actions up to date (workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # Keep npm devDependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Only patch and minor updates; majors need intentional human review
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
