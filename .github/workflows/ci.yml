name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Exercise the zero-build path (ADR-0002): raw `node` type-stripping must be
      # able to load the source. Catches strip-incompatible syntax (e.g. parameter
      # properties) that esbuild-based test/build tolerate but `node src/...` and
      # `npm run eval` do not. The cosmetic sample resolves locally, so no API key.
      - name: Smoke-test the raw-node CLI path
        run: node src/cli.ts examples/samples/cosmetic.before.txt examples/samples/cosmetic.after.txt
